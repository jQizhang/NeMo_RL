# Training: BF16 (with FP8 base checkpoint dequantized to BF16 at load time).
# Rollout : vLLM in FP8 (E4M3 + per-block scales [128,128]).

defaults: ../examples/configs/grpo_math_1B.yaml

grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  batch_multiplier: 1
  max_rollout_turns: 1
  max_num_epochs: 10
  max_num_steps: 10000
  normalize_rewards: true
  use_leave_one_out_baseline: false
  val_period: 10
  val_at_start: false
  overlong_filtering: false
  max_val_samples: 960
  val_batch_size: 960
  use_dynamic_sampling: false
  seed: 42
  reward_scaling:
    enabled: true
    target_min: -1.0
  reward_shaping:
    enabled: true
    overlong_buffer_length: 512
    max_response_length: 4096

loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_ratio: 2
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  ratio_clip_c: 10
  token_level_loss: true
checkpointing:
  enabled: true
  checkpoint_dir: results/grpo-dsv4-flash-8n4g-8k
  keep_top_k: 5
  save_period: 5
  checkpoint_must_save_by: "00:03:45:00"
policy:
  model_name: /apps/models/DeepSeek-V4-Flash-Base
  tokenizer:
    name: /apps/models/DeepSeek-V4-Flash-Base
    chat_template: null
  train_micro_batch_size: 1
  train_global_batch_size: 512
  logprob_batch_size: 1
  precision: "bfloat16"
  max_total_sequence_length: 6144
  logprob_chunk_size: 1024
  offload_optimizer_for_logprob: true

  optimizer:
    name: "transformer_engine.pytorch.optimizers.fused_adam.FusedAdam"
    kwargs:
      lr: 1.0e-06
      weight_decay: 0.1
      betas: [0.9, 0.999]
      eps: 1.0e-08
      master_weights: true
      store_param_remainders: true
      exp_avg_dtype: "torch.bfloat16"
      exp_avg_sq_dtype: "torch.bfloat16"
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 1.0e-08
      end_factor: 1.0
      total_iters: 10
  - name: torch.optim.lr_scheduler.ConstantLR
    kwargs:
      factor: 1.0
      total_iters: 10000000000
  - milestones:
    - 10
  dtensor_cfg:
    expert_parallel_size: 32
    activation_checkpointing: true
    moe_parallelizer:
      ignore_router_for_ac: true
    env_vars:
      NEMO_AUTOMODEL_DSV4_EXPERT_LAYOUT: base
      NEMO_AUTOMODEL_MOE_SCATTER_CHUNK_ROWS: "4096"
    automodel_kwargs:
      backend:
        _target_: nemo_automodel.components.models.common.utils.BackendConfig
        attn: sdpa
        linear: torch
        rms_norm: torch_fp32
        fake_balanced_gate: false
        rope_fusion: false
        dispatcher: torch
        experts: torch_mm
        enable_hf_state_dict_adapter: true
  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: true
  generation:
    max_new_tokens: 4096
    vllm_cfg:
      tensor_parallel_size: 4
      pipeline_parallel_size: 1
      expert_parallel_size: 1
      precision: "fp8"
      kv_cache_dtype: "fp8_ds_mla"
      pow2_weight_scaling_factors: true
      gpu_memory_utilization: 0.6
      enforce_eager: true
      max_model_len: 6144
      use_deep_gemm: true
    colocated:
      enabled: true

data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: "dapo_math_verify"
logger:
  wandb_enabled: true
  wandb:
    project: nemorl-dsv4-gb200
    name: grpo-dsv4-flash-8n4g-8k
cluster:
  gpus_per_node: 4
  num_nodes: 8