defaults: ../examples/configs/grpo_math_1B.yaml

grpo:
  num_prompts_per_step: 16
  num_generations_per_prompt: 8
  batch_multiplier: 1
  max_rollout_turns: 1
  max_num_steps: 10
  use_leave_one_out_baseline: false
  val_period: 1000
  val_at_start: false
  val_at_end: false
  max_val_samples: 64
  val_batch_size: 64
  use_dynamic_sampling: false
  reward_scaling:
    enabled: true
    source_min: 0.0
    source_max: 1.0
    target_min: -1.0
    target_max: 1.0
  reward_shaping:
    enabled: true
    overlong_buffer_length: 256
    max_response_length: 1024

loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_ratio: 2
  ratio_clip_max: 0.28
  ratio_clip_c: 10

checkpointing:
  enabled: false
  checkpoint_dir: "results/grpo-dsv4-flash-4layers-1n4g"
  keep_top_k: 1
  save_period: 100
  model_save_format: "safetensors"
  save_consolidated: false
  save_optimizer: false

policy:
  model_name: /apps/models/DeepSeek-V4-Flash-Base-4layers
  tokenizer:
    name: /apps/models/DeepSeek-V4-Flash-Base-4layers
    chat_template: null
  train_micro_batch_size: 1
  train_global_batch_size: 8
  logprob_batch_size: 1
  precision: "bfloat16"
  max_total_sequence_length: 2048
  make_sequence_length_divisible_by: 8
  max_grad_norm: 1.0

  optimizer:
    name: "transformer_engine.pytorch.optimizers.fused_adam.FusedAdam"
    kwargs:
      lr: 5.0e-06
      weight_decay: 0.1
      betas: [0.9, 0.98]
      eps: 1.0e-05
      master_weights: true
      store_param_remainders: true
      exp_avg_dtype: "torch.bfloat16"
      exp_avg_sq_dtype: "torch.bfloat16"
  scheduler:
  - name: torch.optim.lr_scheduler.LinearLR
    kwargs:
      start_factor: 1.0e-08
      end_factor: 1.0
      total_iters: 5
  - name: torch.optim.lr_scheduler.ConstantLR
    kwargs:
      factor: 1.0
      total_iters: 10000000000
  - milestones:
    - 5

  dtensor_cfg:
    _v2: true
    enabled: true
    env_vars:
      NEMO_AUTOMODEL_DSV4_EXPERT_LAYOUT: base
      NEMO_AUTOMODEL_MOE_SCATTER_CHUNK_ROWS: "4096"
    tensor_parallel_size: 1
    context_parallel_size: 1
    expert_parallel_size: 4
    activation_checkpointing: true
    automodel_kwargs:
      backend:
        _target_: nemo_automodel.components.models.common.utils.BackendConfig
        attn: sdpa
        linear: torch
        rms_norm: torch_fp32
        fake_balanced_gate: false
        rope_fusion: false
        dispatcher: deepep
        experts: torch_mm
        enable_hf_state_dict_adapter: true

  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: true
  generation:
    max_new_tokens: 1024
    vllm_cfg:
      tensor_parallel_size: 4
      pipeline_parallel_size: 1
      expert_parallel_size: 4
      enable_expert_parallel: true
      precision: "fp8"
      kv_cache_dtype: "fp8_ds_mla"
      pow2_weight_scaling_factors: true
      gpu_memory_utilization: 0.4
      enforce_eager: false
      max_model_len: 2048
      use_deep_gemm: true
    colocated:
      enabled: true

data:
  max_input_seq_length: 1024
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null
env:
  math:
    num_workers: 16
    math_verify_impl: "dapo_math_verify"
logger:
  wandb_enabled: true
  monitor_gpus: false
  wandb:
    project: nemorl-dsv4-exp
    name: grpo-dsv4-flash-4layers-1n8g
cluster:
  gpus_per_node: 4
  num_nodes: 1
