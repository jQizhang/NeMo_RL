# Score centering with the top-32 sampler head and TIS, sampling with top-p 0.97.
# Score centering under a sampling filter needs Sampler Replay, and top-p needs a
# top_k that bounds the kept set, so top_k equals the captured head size.
defaults: ./grpo-qwen3.5-9b-dapomath17k-gym-2n8g-megatron-noncolocated-single-controller-score-centering-top32-tis.yaml

policy:
  generation:
    top_k: 32
    top_p: 0.97
    sampler_replay:
      enabled: true

checkpointing:
  checkpoint_dir: results/grpo-qwen3.5-9b-dapomath17k-gym-2n8g-megatron-noncolocated-single-controller-score-centering-top32-tis-topp0.97

logger:
  log_dir: logs/grpo-qwen3.5-9b-dapomath17k-gym-2n8g-megatron-noncolocated-single-controller-score-centering-top32-tis-topp0.97
  wandb:
    name: grpo-qwen3.5-9b-dapomath17k-gym-2n8g-megatron-noncolocated-single-controller-score-centering-top32-tis-topp0.97
