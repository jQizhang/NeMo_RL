# SingleController GRPO on DAPO-Math-17K: Qwen3.5-9B-Base trained with Megatron on
# one node, generated with non-colocated vLLM on a second node.
defaults: ../../grpo_math_1B_megatron_single_controller.yaml

grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  use_leave_one_out_baseline: false

# Generation may run up to 4 versions ahead of the trainer, so rollouts can be
# off-policy. The buffer holds (lookahead + 1) prompt batches.
async_rl:
  sampler:
    max_lookahead_versions: 4
  max_buffered_rollouts: 160

loss_fn:
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2
  reference_policy_kl_penalty: 0.0
  ratio_clip_max: 0.28
  ratio_clip_c: 10

checkpointing:
  enabled: true
  checkpoint_dir: results/grpo-qwen3.5-9b-dapomath17k-2n8g-megatron-noncolocated-single-controller

policy:
  model_name: Qwen/Qwen3.5-9B-Base
  train_global_batch_size: 512
  train_micro_batch_size: 1
  logprob_batch_size: 1
  # 2048 prompt + 8192 response.
  max_total_sequence_length: 10240
  sequence_packing:
    enabled: false
  megatron_cfg:
    tensor_model_parallel_size: 4
    sequence_parallel: true
    apply_rope_fusion: false
    activation_checkpointing: true
    defer_fp32_logits: true
  generation:
    max_new_tokens: 8192
    vllm_cfg:
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.7
    colocated:
      resources:
        # One full node for inference; the other node trains.
        gpus_per_node: 8
        num_nodes: 1

data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024

env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify

logger:
  wandb_enabled: true
  tensorboard_enabled: true
  log_dir: logs/grpo-qwen3.5-9b-dapomath17k-2n8g-megatron-noncolocated-single-controller
  wandb:
    project: nemorl-sc-study
    name: grpo-qwen3.5-9b-dapomath17k-2n8g-megatron-noncolocated-single-controller

cluster:
  gpus_per_node: 8
  num_nodes: 2
