# Shared settings of the Qwen3-8B-Base SingleController study on DAPO-Math-17K through NeMo-Gym
# (math-verify rewards) with token capture: 2 Megatron training nodes + 2 non-colocated vLLM nodes,
# 32 prompts x 16 generations per step, 2048 prompt + 8192 response tokens, 500 steps.
# Each experiment file overrides only what differs; lag 4 with TIS is the default here.
# The Gym data is the one prepared for the Qwen3.5 recipes (rows carry an agent_ref) under $HF_HOME/gym-dapo.
defaults: ../examples/configs/grpo_math_1B_megatron_single_controller.yaml

grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  max_num_steps: 500
  use_leave_one_out_baseline: false

loss_fn:
  reference_policy_kl_penalty: 0.0
  ratio_clip_max: 0.28
  ratio_clip_c: 10
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2

# Generation may run up to max_lookahead_versions behind the trainer; the buffer holds
# (lookahead + 1) prompt batches.
async_rl:
  sampler:
    name: in_order
    max_lookahead_versions: 4
  max_buffered_rollouts: 160

token_capture:
  enabled: true

checkpointing:
  enabled: true
  save_period: 10
  # Save and stop before the 4 h job limit; the next job of the chain resumes from it.
  checkpoint_must_save_by: 00:03:45:00

policy:
  model_name: /apps/models/Qwen3-8B-Base
  train_global_batch_size: 512
  train_micro_batch_size: 1
  logprob_batch_size: 1
  # 2048 prompt + 8192 response.
  max_total_sequence_length: 10240
  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}
  sequence_packing:
    enabled: false
  megatron_cfg:
    tensor_model_parallel_size: 4
    sequence_parallel: true
    activation_checkpointing: true
    defer_fp32_logits: true
    # lr 1e-6 as in the DAPO recipes (the base default is 5e-6); min_lr and the warmup start
    # keep the base ratio of 10%.
    optimizer:
      lr: 1.0e-6
      min_lr: 1.0e-7
    scheduler:
      lr_warmup_init: 1.0e-7
  generation:
    max_new_tokens: 8192
    vllm_cfg:
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.7
      expose_http_server: true
    colocated:
      resources:
        # Two full nodes for inference; the other two nodes train.
        gpus_per_node: 8
        num_nodes: 2

data:
  max_input_seq_length: null
  train:
    dataset_name: NemoGymDataset
    data_path: ${oc.env:HF_HOME}/gym-dapo/dapo17k_train.jsonl
    split_validation_size: 0
  validation:
    dataset_name: NemoGymDataset
    data_path: ${oc.env:HF_HOME}/gym-dapo/aime24_validation.jsonl
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    prompt_file: null
    processor: nemo_gym_data_processor

env:
  should_use_nemo_gym: true
  nemo_gym:
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/math_with_judge/configs/math_with_judge.yaml
    math_with_judge:
      resources_servers:
        math_with_judge:
          should_use_judge: false

logger:
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemorl-sc-study-qwen3-8b-dapo

cluster:
  gpus_per_node: 8
  num_nodes: 4
