# Experiment 8: exp7 with the NeMo-Gym math environment replaced by NeMo-RL's native math environment
# (DAPO-Math-17K prompts, dapo_math_verify rewards), plus an online eval on AIME 2024 every 10 steps.
# Everything else matches exp7: legacy GRPO trainer, colocated generation on 4 nodes, lag 0, TIS, no score
# centering, Qwen3-8B-Base, 32 prompts x 16 generations, 2048 prompt + 8192 response tokens, 500 steps.
# Unlike the DAPO Gemma recipe this does not turn on dynamic sampling or reward scaling/shaping, as exp7 has none.
defaults: ../examples/configs/grpo_math_1B.yaml

grpo:
  num_prompts_per_step: 32
  num_generations_per_prompt: 16
  max_num_steps: 500
  use_leave_one_out_baseline: false
  # Online eval on AIME 2024 (960 rows) after every 10th step, and once before training.
  val_period: 10
  val_at_start: true
  max_val_samples: 960
  val_batch_size: 960

loss_fn:
  reference_policy_kl_penalty: 0.0
  ratio_clip_max: 0.28
  ratio_clip_c: 10
  use_importance_sampling_correction: true
  truncated_importance_sampling_type: tis
  truncated_importance_sampling_ratio: 2

checkpointing:
  enabled: true
  checkpoint_dir: results/qwen3-8b-base-colocated-lag0-tis-native-math-lr1e-6
  # The default metric, val:accuracy, ranks the kept checkpoints; the latest one is always kept for resuming.
  save_period: 10
  # Save and stop before the 4 h job limit; the next job of the chain resumes from it.
  checkpoint_must_save_by: 00:03:45:00

policy:
  model_name: /apps/models/Qwen3-8B-Base
  train_global_batch_size: 512
  train_micro_batch_size: 1
  logprob_batch_size: 1
  # 2048 prompt + 8192 response.
  max_total_sequence_length: 10240
  make_sequence_length_divisible_by: ${policy.megatron_cfg.tensor_model_parallel_size}
  automodel_cfg:
    enabled: false
  sequence_packing:
    enabled: false
  megatron_cfg:
    enabled: true
    tensor_model_parallel_size: 4
    sequence_parallel: true
    activation_checkpointing: true
    defer_fp32_logits: true
    # lr 1e-6 as in the DAPO recipes (the base default is 5e-6); min_lr and the warmup start
    # keep the base ratio of 10%.
    optimizer:
      lr: 1.0e-6
      min_lr: 1.0e-7
    scheduler:
      lr_warmup_init: 1.0e-7
  generation:
    max_new_tokens: 8192
    vllm_cfg:
      tensor_parallel_size: 4

data:
  max_input_seq_length: 2048
  train:
    dataset_name: DAPOMath17K
  validation:
    dataset_name: DAPOMathAIME2024
  default:
    prompt_file: null

env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify

logger:
  log_dir: logs/qwen3-8b-base-colocated-lag0-tis-native-math-lr1e-6
  wandb_enabled: true
  tensorboard_enabled: true
  wandb:
    project: nemorl-sc-study-qwen3-8b-dapo
    name: qwen3-8b-base-colocated-lag0-tis-native-math-lr1e-6

cluster:
  gpus_per_node: 8
  num_nodes: 4
